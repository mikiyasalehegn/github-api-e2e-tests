[pytest]
# Enable real-time logging in the terminal
log_cli = true

# Set the filter level (INFO is standard for QA)
log_cli_level = INFO

# Define the visual structure of each log line
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

# Make the timestamp easy to read
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    e2e: end-to-end tests
    unit: mocked tests
    repo_config: configuration for the temporary repository fixture