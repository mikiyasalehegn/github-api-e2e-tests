name: E2E Tests

on:
  push:

jobs:

  test:

    runs-on: ubuntu-latest

    env:
      TOKEN: ${{ secrets.TOKEN }}
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      COLLABORATOR_TOKEN: ${{ secrets.COLLABORATOR_TOKEN }}
      COLLABORATOR: ${{ secrets.COLLABORATOR }}
      READ_ONLY_TOKEN: ${{ secrets.READ_ONLY_TOKEN }}

    steps:

      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Slack Start Notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text":" E2E pipeline started\n🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }' ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Run tests
        run: |
          mkdir -p reports
          pytest tests/e2e -v --html=reports/e2e-report.html --self-contained-html | tee reports/pytest_output.txt

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text":"✅ E2E tests passed!\n🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Failure Notification
        if: failure()
        run: |

          FAILED_TESTS=$(grep FAILED pytest_output.txt || true)

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\":\"❌ E2E tests failed!\n\nFailed Tests:\n$FAILED_TESTS\n\n🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: report.html